<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rate Driver</title>
  <link rel="stylesheet" href="../styles/styles.css">
  <style>
    .rating-wrap{max-width:720px;margin:24px auto;padding:18px;border-radius:8px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
    .driver-row{display:flex;gap:12px;align-items:center}
    .driver-avatar{width:64px;height:64px;border-radius:9999px;background:#eee;display:flex;align-items:center;justify-content:center;font-weight:700;color:#444}
    .driver-meta{flex:1}
    .stars{display:flex;gap:6px;margin:12px 0}
    .star{font-size:34px;cursor:pointer;color:#ddd}
    .star.filled{color:#F4C150}
    textarea{width:100%;min-height:100px;padding:10px;border:1px solid #ddd;border-radius:6px}
    .controls{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
    .btn{padding:8px 14px;border-radius:6px;border:0;cursor:pointer}
    .btn.primary{background:#2A9D8F;color:#fff}
    .btn.ghost{background:#f5f5f5}
  </style>
</head>
<body>
  <main class="rating-wrap">
    <h2>Rate your driver</h2>

    <section class="driver-row">
      <div class="driver-avatar" id="driver-avatar">👤</div>
      <div class="driver-meta">
        <div id="driver-name" style="font-weight:700">Driver Name</div>
        <div id="driver-vehicle" style="font-size:0.9rem;color:#666">Vehicle</div>
        <div id="driver-capacity" style="font-size:0.85rem;color:#888;margin-top:6px">Seats</div>
      </div>
    </section>

    <div style="margin-top:18px">
      <label style="display:block;font-weight:600;margin-bottom:6px">Your rating</label>
      <div class="stars" id="stars">
        <span class="star" data-value="1">☆</span>
        <span class="star" data-value="2">☆</span>
        <span class="star" data-value="3">☆</span>
        <span class="star" data-value="4">☆</span>
        <span class="star" data-value="5">☆</span>
      </div>
    </div>

    <div style="margin-top:12px">
      <label style="display:block;font-weight:600;margin-bottom:6px">Comments (optional)</label>
      <textarea id="comments" placeholder="Write about your experience or report a problem..."></textarea>
    </div>

    <div class="controls">
      <button class="btn ghost" id="skip-btn">Skip</button>
      <button class="btn primary" id="submit-btn">Submit rating</button>
    </div>
  </main>

  <script src="../js/rate-driver.js"></script>
</body>
</html>
