<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Request a Ride — Corosa</title>
    <link rel="stylesheet" href="../styles/styles.css">
    <style>
        /* Compact layout matching other pages: map on top, rides below */
        .map-card { margin-bottom: var(--spacing-md); }
        #map { width: 100%; height: 360px; border-radius: var(--radius-md); }
        .ride-list { display: grid; gap: var(--spacing-md); }
        .ride-card { display: flex; gap: var(--spacing-md); align-items: center; padding: var(--spacing-md); border-radius: var(--radius-md); border:1px solid var(--color-border); background: var(--color-background); }
        .driver-avatar { width:56px; height:56px; border-radius:50%; background:var(--color-secondary); display:flex; align-items:center; justify-content:center; color:var(--color-muted-foreground); flex-shrink:0; }
        .ride-meta { flex:1; }
        .vehicle-row { color:var(--color-muted-foreground); font-size:var(--font-size-sm); display:flex; gap:var(--spacing-md); align-items:center; }
        .capacity { font-weight:600; }
        .request-col { width:140px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <div class="logo">
                <div class="logo-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M3 12h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="logo-text">
                    <h1 style="font-size:1rem;">Corosa</h1>
                </div>
            </div>
            <nav class="nav header-nav">
                <a class="btn btn-outline" href="index.html">Home</a>
                <a class="btn btn-outline" href="signup.html">Create account</a>
            </nav>
        </div>
    </header>

    <main class="container" style="padding-top:var(--spacing-lg); padding-bottom:var(--spacing-xl);">
        <section class="card map-card">
            <h3 style="margin:0 0 var(--spacing-sm) 0;">Your route</h3>
            <p class="text-muted">Pickup and drop-off locations are shown on the map below.</p>
            <div id="map" class="map-placeholder">Loading map…</div>
            <div style="display:flex; gap:var(--spacing-md); margin-top:var(--spacing-sm);">
                <div style="flex:1">
                    <small class="text-muted">Pickup</small>
                    <div id="pickup-location">Loading...</div>
                </div>
                <div style="flex:1">
                    <small class="text-muted">Drop-off</small>
                    <div id="dropoff-location">Loading...</div>
                </div>
            </div>
        </section>

        <section>
            <h3>Available rides</h3>
            <div class="ride-list" id="ride-list">
                <!-- Ride cards will be injected here by JS -->
            </div>
        </section>
    </main>

    <footer class="container" style="padding:var(--spacing-md) 0; text-align:center; color:var(--color-muted-foreground);">
        <small>&copy; <span id="year"></span> Corosa — SLU Maryheights</small>
    </footer>

    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
    <script src="../js/request-ride.js"></script>
</body>
</html>
