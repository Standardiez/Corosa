<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Ride - UniRide</title>
    <link rel="stylesheet" href="../assets/styles/index.css">
    <link rel="stylesheet" href="../assets/styles/tailwind.css">
    <link rel="stylesheet" href="../assets/styles/components.css">
</head>
<body>
    <div class="container mx-auto p-4">
        <h1 class="text-2xl font-bold">Request Ride</h1>
        <form id="request-ride-form" class="mt-4">
            <div class="mb-4">
                <label for="pickup" class="block text-sm font-medium">Pickup Location</label>
                <input type="text" id="pickup" name="pickup" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
            </div>
            <div class="mb-4">
                <label for="destination" class="block text-sm font-medium">Destination</label>
                <input type="text" id="destination" name="destination" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
            </div>
            <div class="mb-4">
                <label for="payment" class="block text-sm font-medium">Payment Method</label>
                <select id="payment" name="payment" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                    <option value="credit-card">Credit Card</option>
                    <option value="paypal">PayPal</option>
                </select>
            </div>
            <button type="submit" class="bg-primary text-white px-4 py-2 rounded">Confirm Ride</button>
        </form>
    </div>
    <script src="../scripts/main.js"></script>
</body>
</html>
