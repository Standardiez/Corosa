<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Corosa — Carpooling for SLU Maryheights</title>
	<link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
	<header class="header">
		<div class="container header-content">
			<div class="logo">
				<div class="logo-icon" aria-hidden="true">
					<!-- small mark, could be replaced with an SVG later -->
					<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
						<path d="M3 12h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
					</svg>
				</div>
				<div class="logo-text">
					<h1 style="font-size:1rem;">Corosa</h1>
				</div>
			</div>
			<nav class="nav header-nav">
				<a class="btn btn-outline" href="#find">Find a ride</a>
				<a class="btn btn-outline" href="#create">Sign in</a>
			</nav>
			<button class="btn mobile-menu" aria-label="Open menu" style="display:none;">☰</button>
		</div>
	</header>

	<main>
		<section class="hero">
			<div class="container hero-inner">
				<h1 class="hero-title">Corosa</h1>
				<p class="hero-tagline">Carpooling by and for SLU Maryheights.</p>

				<div class="hero-ctas" style="margin-top:var(--spacing-lg);">
					<a id="find" class="btn btn-primary" href="#">Find Ride</a>
					<a id="create" class="btn btn-accent" href="signup.html" style="margin-left:var(--spacing-md);">Create account</a>
				</div>
			</div>
		</section>
	</main>

	<footer class="container" style="padding:var(--spacing-md) 0; text-align:center; color:var(--color-muted-foreground);">
		<small>&copy; <span id="year"></span> Corosa — SLU Maryheights</small>
	</footer>

	<script>
		// small script to show current year
		document.getElementById('year').textContent = new Date().getFullYear();
	</script>
</body>
</html>
