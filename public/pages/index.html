<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Corosa — Carpooling for SLU Maryheights</title>
    <link rel="stylesheet" href="../styles/styles.css" />
    <link
      href="https://cdn.boxicons.com/3.0.3/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="container header-content">
        <div class="logo-wrapper">
          <img
            src="../assets/corosa-logo.png"
            alt="Corosa Logo"
            class="logo"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='block'"
          />
          <!-- Fallback text logo using design system classes -->
          <span class="logo-fallback">COROSA</span>
        </div>
        <nav class="nav header-nav">
          <a class="btn btn-outline" id="signup-link" href="login.html"
            >Login</a
          >
          <a class="btn btn-outline" id="register-link" href="signup.html"
            >Register</a
          >
          <button
            class="btn btn-outline user-menu-btn"
            id="user-menu-btn"
            aria-label="User menu"
          >
            <i class="bx bx-user"></i>
            <span id="user-initials"></span>
          </button>
        </nav>
        <button class="btn mobile-menu" aria-label="Open menu">☰</button>
      </div>
    </header>

    <main>
      <div class="page-container">
        <!-- Page Header -->
        <div class="page-header">
          <h1>Welcome to Corosa!</h1>
          <p>What would you like to do today?</p>
        </div>

        <!-- Role Selection Container -->
        <div class="role-selection-container">
          <div class="role-card">
            <button class="btn-role btn-passenger" id="book-ride-btn">
              <i class="bx bx-user"></i>
              Book a Ride
            </button>
          </div>
          <div class="role-card">
            <button class="btn-role btn-driver" id="offer-ride-btn">
              <i class="bx bx-car"></i>
              Offer a Ride
            </button>
          </div>
        </div>
      </div>
    </main>

    <footer class="welcome-footer">
      <small>&copy; <span id="year"></span> Corosa — SLU Maryheights</small>
    </footer>

    <script>
      // small script to show current year
      document.getElementById("year").textContent = new Date().getFullYear();

      // Check if user is logged in
      function isUserLoggedIn() {
        return localStorage.getItem("userData") !== null;
      }

      // Handle role selection buttons
      document
        .getElementById("book-ride-btn")
        .addEventListener("click", function () {
          // Check if user is logged in
          if (!isUserLoggedIn()) {
            // Redirect to login if not logged in
            window.location.href = "login.html";
          } else {
            // Redirect to passenger side (landing page)
            window.location.href = "landing-page.html";
          }
        });

      document
        .getElementById("offer-ride-btn")
        .addEventListener("click", function () {
          // Check if user is logged in
          if (!isUserLoggedIn()) {
            // Redirect to login if not logged in
            window.location.href = "login.html";
          } else {
            // Redirect to driver side
            window.location.href = "driver-Homepage.html";
          }
        });
    </script>
    <script src="../js/header-auth.js"></script>
  </body>
</html>
