<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carosa - Vehicle Registration</title>
    <style>
        /* CAROSA DESIGN SYSTEM VARIABLES 
           (Values are placeholders to ensure rendering, using variable names from guidelines)
        */
        :root {
            /* Colors */
            --primary: #4F46E5;
            --primary-dark: #4338ca;
            --primary-light: #e0e7ff;
            
            --background: #f3f4f6;
            --background-alt: #ffffff;
            --background-hover: #f9fafb;
            
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            
            --accent: #8b5cf6;
            --error: #ef4444;
            
            /* Spacing */
            --spacing-xl: 3rem;
            --spacing-lg: 2rem;
            --spacing-md: 1rem;
            --spacing-sm: 0.5rem;
            
            /* Typography Scale & Weight */
            --font-size-3xl: 2.25rem;
            --font-size-2xl: 1.5rem;
            --font-size-lg: 1.125rem;
            --font-size-base: 1rem;
            --font-size-sm: 0.875rem;
            
            --font-weight-bold: 700;
            --font-weight-semibold: 600;
            --font-weight-medium: 500;
            --font-weight-regular: 400;

            /* UI Elements */
            --radius-lg: 0.75rem;
            --radius-md: 0.375rem;
            --max-width: 800px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }

        /* RESET & BASE STYLES */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-primary);
            line-height: 1.5;
        }

        /* LAYOUT CONTAINERS */
        .container {
            max-width: var(--max-width);
            margin: var(--spacing-xl) auto; /* Top/bottom page margins */
            padding: 0 var(--spacing-md);
        }

        /* TYPOGRAPHY */
        h1 {
            font-size: var(--font-size-3xl);
            font-weight: var(--font-weight-bold);
            margin-bottom: var(--spacing-lg);
            text-align: center;
            color: var(--text-primary);
        }

        h2 {
            font-size: var(--font-size-2xl);
            font-weight: var(--font-weight-semibold);
            margin-bottom: var(--spacing-md);
            color: var(--text-primary);
        }

        /* COMPONENT: CARD */
        .card {
            background-color: var(--background-alt); /* Always use background-alt */
            padding: var(--spacing-lg); /* Outer padding */
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
        }

        /* FORMS */
        .form-section {
            margin-bottom: var(--spacing-lg); /* Separation between sections */
            border-bottom: 1px solid var(--background);
            padding-bottom: var(--spacing-lg);
        }

        .form-section:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .form-group {
            margin-bottom: var(--spacing-lg); /* Separation between groups */
            display: flex;
            flex-direction: column;
        }

        label {
            color: var(--text-secondary); /* Apply text-secondary */
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            margin-bottom: var(--spacing-sm);
        }

        input[type="text"],
        input[type="number"],
        select {
            padding: var(--spacing-md); /* Input fields padding */
            border: 1px solid var(--text-muted);
            border-radius: var(--radius-md);
            font-size: var(--font-size-base);
            color: var(--text-primary);
            background-color: var(--background-alt);
            transition: border-color 0.2s;
            width: 100%;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            ring: 2px solid var(--primary-light);
        }

        /* FILE UPLOAD COMPONENT */
        .file-upload-wrapper {
            border: 2px dashed var(--text-muted);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            text-align: center;
            cursor: pointer;
            background-color: var(--background-hover);
            transition: all 0.3s ease;
        }

        .file-upload-wrapper:hover {
            border-color: var(--primary);
            background-color: var(--primary-light);
        }

        .file-upload-input {
            display: none;
        }

        .preview-image {
            max-width: 100%;
            max-height: 200px;
            margin-top: var(--spacing-md);
            border-radius: var(--radius-md);
            display: none;
        }

        /* GRID SYSTEM FOR FORM */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-lg); /* Space between related elements */
        }

        /* BUTTONS */
        .btn-primary {
            background-color: var(--primary); /* Primary button background */
            color: white;
            padding: var(--spacing-md); /* Maintain spacing-md padding */
            border: none;
            border-radius: var(--radius-md);
            font-weight: var(--font-weight-medium);
            font-size: var(--font-size-base);
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 768px) {
            .container {
                margin: var(--spacing-lg) auto; /* Reduce xl to lg */
            }
            
            .card {
                padding: var(--spacing-md); /* Reduce lg to md */
            }

            .form-grid {
                grid-template-columns: 1fr; /* Stack elements vertically */
                gap: var(--spacing-md);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Vehicle Registration</h1>

        <form id="vehicleForm" class="card">
            
            <div class="form-section">
                <h2>Driver Details</h2>
                
                <div class="form-group">
                    <label for="driverName">Full Name</label>
                    <input type="text" id="driverName" name="driverName" placeholder="Enter driver's full name" required>
                </div>

                <div class="form-group">
                    <label for="driverName">birth date</label>
                    <input type="text" id="birthdate" name="birthdate" placeholder="enter birthdate" required>
                </div>

                <div class="form-group">
                    <label for="driverName">email address/label>
                    <input type="text" id="email address" name="adress" placeholder="Enter email address" required>
                </div>

                <div class="form-group">
                    <label>Driver's License Photo</label>
                    <div class="file-upload-wrapper" id="dropZone">
                        <span style="color: var(--text-secondary);">Click to upload or drag license image here</span>
                        <input type="file" id="licenseUpload" name="licenseUpload" accept="image/*" class="file-upload-input" required>
                        <img id="licensePreview" class="preview-image" alt="License Preview">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h2>Vehicle Information</h2>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="vehicleType">Vehicle Type</label>
                        <select id="vehicleType" name="vehicleType" required>
                            <option value="" disabled selected>Select type</option>
                            <option value="sedan">Sedan</option>
                            <option value="suv">SUV</option>
                            <option value="van">Van</option> 
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="vehicleModel">Model</label>
                        <input type="text" id="vehicleModel" name="vehicleModel" placeholder="e.g., Toyota Vios" required>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="plateNumber">Plate Number</label>
                        <input type="text" id="plateNumber" name="plateNumber" placeholder="ABC 1234" style="text-transform: uppercase;" required>
                    </div>

                    <div class="form-group">
                        <label for="seatingCapacity">Seating Capacity</label>
                        <input type="number" id="seatingCapacity" name="seatingCapacity" min="1" max="50" placeholder="4" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-primary">Register Vehicle</button>

        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('licenseUpload');
            const preview = document.getElementById('licensePreview');
            const form = document.getElementById('vehicleForm');

            // Handle clicking the upload area
            dropZone.addEventListener('click', () => fileInput.click());

            // Handle file selection
            fileInput.addEventListener('change', function(e) {
                handleFile(this.files[0]);
            });

            // Handle Drag and Drop visuals
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.style.borderColor = 'var(--primary)';
                dropZone.style.backgroundColor = 'var(--primary-light)';
            });

            dropZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                dropZone.style.borderColor = 'var(--text-muted)';
                dropZone.style.backgroundColor = 'var(--background-hover)';
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.style.borderColor = 'var(--text-muted)';
                dropZone.style.backgroundColor = 'var(--background-hover)';
                
                if (e.dataTransfer.files.length) {
                    fileInput.files = e.dataTransfer.files;
                    handleFile(e.dataTransfer.files[0]);
                }
            });

            // Preview Image Logic
            function handleFile(file) {
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        preview.src = e.target.result;
                        preview.style.display = 'block';
                    }
                    reader.readAsDataURL(file);
                }
            }

            // Form Submission
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                // Collect Form Data
                const formData = new FormData(form);
                const data = Object.fromEntries(formData);
                
                // In a real app, you would send this to your backend
                console.log('Registration Data:', data);
                alert(`Vehicle Registration Submitted!\nDriver: ${data.driverName}\nPlate: ${data.plateNumber}`);
                
                // Optional: Reset form
                // form.reset();
                // preview.style.display = 'none';
            });
        });
    </script>
</body>
</html>
