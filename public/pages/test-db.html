<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Corosa — DB Connection Test</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;max-width:900px;margin:24px auto;color:#111}
    label,input,button{font-size:14px}
    input[type=text]{width:100%;padding:8px;margin:6px 0;border:1px solid #ccc;border-radius:4px}
    button{padding:8px 12px;border-radius:6px;border:1px solid #2b6cb0;background:#2b6cb0;color:#fff}
    pre{background:#f6f8fa;padding:12px;border-radius:6px;overflow:auto}
    table{border-collapse:collapse;width:100%;margin-top:12px}
    th,td{border:1px solid #ddd;padding:8px;text-align:left}
  </style>
</head>
<body>
  <h1>Corosa — Database connection test</h1>
  <p>Use this page to test that your frontend can reach the backend API and fetch users from PostgreSQL.</p>

  <label for="baseUrl">API base URL (leave empty to use same origin)</label>
  <input id="baseUrl" type="text" placeholder="e.g. http://localhost:8000 or http://127.0.0.1/corosa" />

  <p>This will call: <code>&lt;base&gt;/backend/api/users.php</code></p>

  <button id="btnTest">Test /backend/api/users.php (GET)</button>

  <h3>Result</h3>
  <div id="status">Not tested yet.</div>
  <pre id="output" style="display:none"></pre>

  <h3>Users</h3>
  <div id="usersArea">No data</div>

  <script>
    const btn = document.getElementById('btnTest');
    const status = document.getElementById('status');
    const output = document.getElementById('output');
    const usersArea = document.getElementById('usersArea');
    const baseInput = document.getElementById('baseUrl');

    function getApiUrl() {
      const base = baseInput.value.trim();
      if (!base) return '/backend/api/users.php';
      // remove trailing slash if present
      return base.replace(/\/+$/, '') + '/backend/api/users.php';
    }

    async function testApi() {
      const url = getApiUrl();
      status.textContent = 'Requesting ' + url + ' ...';
      output.style.display = 'none';
      usersArea.innerHTML = 'Loading...';

      try {
        const res = await fetch(url, { method: 'GET', credentials: 'include' });
        const text = await res.text();
        let json;
        try { json = JSON.parse(text); } catch (e) { json = null; }

        status.textContent = `HTTP ${res.status} ${res.statusText}`;
        output.style.display = 'block';
        output.textContent = text;

        if (json && json.success !== undefined) {
          // expected API shape
          if (json.success && Array.isArray(json.data)) {
            renderUsers(json.data);
          } else if (json.success && json.data && !Array.isArray(json.data)) {
            renderUsers([json.data]);
          } else {
            usersArea.innerHTML = '<em>No users returned or success=false</em>';
          }
        } else if (Array.isArray(json)) {
          renderUsers(json);
        } else {
          usersArea.innerHTML = '<em>Unexpected response format. See raw output.</em>';
        }

      } catch (err) {
        status.textContent = 'Request failed';
        output.style.display = 'block';
        output.textContent = err.toString();
        usersArea.innerHTML = '<em>Request error. Check server URL, CORS, and that backend is running.</em>';
      }
    }

    function renderUsers(users) {
      if (!users.length) {
        usersArea.innerHTML = '<em>No users found</em>';
        return;
      }
      const cols = Object.keys(users[0]);
      let html = '<table><thead><tr>' + cols.map(c => '<th>'+escapeHtml(c)+'</th>').join('') + '</tr></thead><tbody>';
      for (const u of users) {
        html += '<tr>' + cols.map(c => '<td>'+escapeHtml(String(u[c]===null? '': u[c]))+'</td>').join('') + '</tr>';
      }
      html += '</tbody></table>';
      usersArea.innerHTML = html;
    }

    function escapeHtml(s) {
      return s.replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    }

    btn.addEventListener('click', testApi);
  </script>
</body>
</html>
