<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard — Corosa</title>

    <link rel="stylesheet" href="../styles/styles.css">
    <link href="https://cdn.boxicons.com/3.0.3/fonts/basic/boxicons.min.css" rel="stylesheet">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="container header-content">
            <img src="../assets/corosa-logo.png" alt="Corosa Logo" class="logo">

            <nav class="nav header-nav">
                <a class="btn btn-outline" href="index.html">Home</a>
                <a class="btn btn-outline" id="signup-link" href="signup.html">Create account</a>

                <button class="btn btn-outline user-menu-btn" id="user-menu-btn" style="display:none;" aria-label="User menu">
                    <i class='bx bx-user' style='color:#806600'></i>
                    <span id="user-initials" style="margin-left:0.5rem;"></span>
                </button>
            </nav>
        </div>
    </header>

    <main class="container">

        <div class="admin-wrapper">

            <!-- Sidebar -->
            <aside class="sidebar">
                <a href="#">User Management</a>
                <a href="#">Vehicle Management</a>
                <a href="#">Rides & Transactions</a>
                <a href="#">Reports & Complaints</a>
            </aside>

            <!-- Dashboard -->
            <section class="dashboard-section">
                <h1>Dashboard Overview</h1>

                <div class="dashboard-grid">

                    <div class="dashboard-card wide">
                        <h2>Rides and transactions</h2>
                    </div>

                    <div class="dashboard-card">
                        <h2>Pending user verification</h2>
                    </div>

                    <div class="dashboard-card">
                        <h2>Pending vehicle verification</h2>
                    </div>

                    <div class="dashboard-card">
                        <h2>Reports and complaints</h2>
                    </div>

                </div>
            </section>

        </div>

    </main>

    <footer class="container" style="padding:var(--spacing-md) 0; text-align:center; color:var(--color-muted-foreground);">
        <small>&copy; <span id="year"></span> Corosa — SLU Maryheights</small>
    </footer>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>

    <script src="../js/header-auth.js"></script>
    <script src="../js/admin-dashboard.js"></script>

</body>
</html>
