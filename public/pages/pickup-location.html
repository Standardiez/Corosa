<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickup Location - UniRide</title>
    <link rel="stylesheet" href="../assets/styles/index.css">
    <link rel="stylesheet" href="../assets/styles/tailwind.css">
    <link rel="stylesheet" href="../assets/styles/components.css">
</head>
<body class="bg-background text-foreground">
    <header>
        <nav id="nav-bar"></nav>
    </header>
    <main class="p-4">
        <h1 class="text-2xl font-bold">Select Your Pickup Location</h1>
        <div id="map-view" class="h-96 mt-4"></div>
        <div class="mt-4">
            <label for="pickup-location" class="block text-lg">Choose a location:</label>
            <select id="pickup-location" class="mt-2 p-2 border border-border rounded">
                <option value="">Select a location</option>
                <!-- Options will be populated dynamically -->
            </select>
        </div>
        <button id="confirm-pickup" class="mt-4 bg-primary text-primary-foreground p-2 rounded">Confirm Pickup</button>
    </main>
    <script src="../components/map-view.js"></script>
    <script src="../scripts/main.js"></script>
</body>
</html>
