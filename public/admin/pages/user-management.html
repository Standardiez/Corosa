<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage Users — Corosa</title>

    <link rel="stylesheet" href="../../styles/styles.css">
    <link href="https://cdn.boxicons.com/3.0.3/fonts/basic/boxicons.min.css" rel="stylesheet">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="container header-content">
            <img src="../../assets/corosa-logo.png" alt="Corosa Logo" class="logo">

            <nav class="nav header-nav">
                <a class="btn btn-outline" href="../../shared/pages/index.html">Home</a>
                <a class="btn btn-outline" id="signup-link" href="../../shared/pages/signup.html">Create account</a>

                <button class="btn btn-outline user-menu-btn" id="user-menu-btn" style="display:none;" aria-label="User menu">
                    <i class='bx bx-user' style='color:#806600'></i>
                    <span id="user-initials" style="margin-left:0.5rem;"></span>
                </button>
            </nav>
        </div>
    </header>

    <main class="container">

        <div class="admin-wrapper">

            <!-- Sidebar -->
            <aside class="sidebar">
                <a href="user-management.html" class="active">User Management</a>
                <a href="vehicle-management.html">Vehicle Management</a>
                <a href="rides-transactions.html">Rides & Transactions</a>
                <a href="reports-complaints.html">Reports & Complaints</a>
            </aside>

            <!-- Main Content -->
            <section class="dashboard-section">
                <h2>Pending Account Verification Requests</h2>

                <div class="table-container card" style="padding: var(--spacing-md); margin-top: var(--spacing-md); overflow-x:auto;">
                    <table class="table" id="userTable">
                        <thead>
                            <tr>
                                <th>User ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Registration Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Rows will be populated by JS -->
                        </tbody>
                    </table>
                </div>
            </section>

        </div>

    </main>

    <footer class="container" style="padding:var(--spacing-md) 0; text-align:center;">
        <small>&copy; <span id="year"></span> Corosa — SLU Maryheights</small>
    </footer>

    <script>document.getElementById("year").textContent = new Date().getFullYear();</script>

    <script src="../js/user-management.js"></script>
    <script src="../../shared/js/header-auth.js"></script>
</body>
</html>
