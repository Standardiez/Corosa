<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniRide - Request Ride</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="../assets/styles/index.css" rel="stylesheet">
    <link href="../assets/styles/components.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-background">
    <!-- Header -->
    <header class="sticky top-0 z-50 w-full border-b bg-background/95 backdrop-blur supports-[backdrop-filter]:bg-background/60">
        <div class="container flex h-14 items-center">
            <a href="./index.html" class="font-bold">UniRide</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-6 max-w-2xl">
        <button class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 hover:bg-accent hover:text-accent-foreground h-10 px-4 py-2 mb-4" onclick="history.back()">
            <i data-lucide="arrow-left" class="h-4 w-4 mr-2"></i>
            Back
        </button>

        <h1 class="text-3xl font-bold mb-6">Confirm Your Ride</h1>

        <!-- Driver Info Card -->
        <div class="rounded-lg border bg-card text-card-foreground shadow-sm mb-6">
            <div class="flex flex-col p-6 space-y-1.5">
                <h3 class="text-lg font-semibold">Driver Information</h3>
            </div>
            <div class="p-6">
                <div class="flex items-start gap-4">
                    <div class="relative flex h-16 w-16 shrink-0 overflow-hidden rounded-full">
                        <img id="driverAvatar" class="aspect-square h-full w-full" alt="">
                        <span id="driverInitials" class="flex h-full w-full items-center justify-center rounded-full bg-muted"></span>
                    </div>
                    <div class="flex-1">
                        <h3 id="driverName" class="font-semibold text-xl mb-2"></h3>
                        <div class="flex items-center gap-3 flex-wrap">
                            <span id="userTypeBadge" class="inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2"></span>
                            <div class="flex items-center gap-1 text-muted-foreground">
                                <i data-lucide="car" class="h-4 w-4"></i>
                                <span id="carModel" class="text-sm"></span>
                            </div>
                            <div class="flex items-center gap-1">
                                <i data-lucide="star" class="h-4 w-4 fill-primary text-primary"></i>
                                <span id="driverRating" class="text-sm font-semibold"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Route Card -->
        <div class="rounded-lg border bg-card text-card-foreground shadow-sm mb-6">
            <div class="flex flex-col p-6 space-y-1.5">
                <h3 class="text-lg font-semibold">Route Details</h3>
            </div>
            <div class="p-6 space-y-4">
                <div class="flex items-start gap-3">
                    <div class="w-8 h-8 rounded-full bg-secondary/50 flex items-center justify-center flex-shrink-0">
                        <i data-lucide="map-pin" class="h-4 w-4 text-secondary-foreground"></i>
                    </div>
                    <div>
                        <p class="text-sm text-muted-foreground">Pickup Location</p>
                        <p id="startLocation" class="font-semibold"></p>
                    </div>
                </div>

                <div class="flex items-start gap-3">
                    <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center flex-shrink-0">
                        <i data-lucide="map-pin" class="h-4 w-4 text-primary-foreground"></i>
                    </div>
                    <div>
                        <p class="text-sm text-muted-foreground">Destination</p>
                        <p id="endLocation" class="font-semibold"></p>
                    </div>
                </div>

                <div class="pt-2">
                    <p class="text-sm text-muted-foreground">Departure Time</p>
                    <p id="departureTime" class="font-semibold"></p>
                </div>
            </div>
        </div>

        <!-- Payment Method Card -->
        <div class="rounded-lg border bg-card text-card-foreground shadow-sm mb-6">
            <div class="flex flex-col p-6 space-y-1.5">
                <h3 class="text-lg font-semibold">Payment Method</h3>
            </div>
            <div class="p-6">
                <div class="grid gap-4">
                    <div class="flex items-center space-x-3 mb-3">
                        <input type="radio" name="payment" value="card" id="card" checked class="radio">
                        <label for="card" class="flex items-center gap-2 cursor-pointer">
                            <i data-lucide="credit-card" class="h-4 w-4"></i>
                            Credit/Debit Card
                        </label>
                    </div>
                    <div class="flex items-center space-x-3 mb-3">
                        <input type="radio" name="payment" value="cash" id="cash" class="radio">
                        <label for="cash" class="flex items-center gap-2 cursor-pointer">
                            <i data-lucide="dollar-sign" class="h-4 w-4"></i>
                            Cash
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tip Card -->
        <div class="rounded-lg border bg-card text-card-foreground shadow-sm mb-6">
            <div class="flex flex-col p-6 space-y-1.5">
                <h3 class="text-lg font-semibold">Add a Tip (Optional)</h3>
            </div>
            <div class="p-6">
                <div class="space-y-4">
                    <div class="flex gap-2">
                        <button class="tipBtn flex-1 inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-10 px-4 py-2" data-amount="0">$0</button>
                        <button class="tipBtn flex-1 inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-10 px-4 py-2" data-amount="2">$2</button>
                        <button class="tipBtn flex-1 inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-10 px-4 py-2" data-amount="5">$5</button>
                        <button class="tipBtn flex-1 inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-10 px-4 py-2" data-amount="10">$10</button>
                    </div>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground">$</span>
                        <input type="number" id="customTip" placeholder="Custom amount" min="0" step="0.01" class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 pl-7">
                    </div>
                </div>
            </div>
        </div>

        <!-- Fare Summary Card -->
        <div class="rounded-lg border bg-card text-card-foreground shadow-sm mb-6">
            <div class="p-6">
                <div class="space-y-3">
                    <div class="flex justify-between">
                        <span class="text-muted-foreground">Base Fare</span>
                        <span class="font-semibold">$5.00</span>
                    </div>
                    <div id="tipRow" class="flex justify-between hidden">
                        <span class="text-muted-foreground">Tip</span>
                        <span id="tipAmount" class="font-semibold">$0.00</span>
                    </div>
                    <hr class="border-border">
                    <div class="flex justify-between text-lg">
                        <span class="font-bold">Total</span>
                        <span id="totalAmount" class="font-bold">$5.00</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Confirm Button -->
        <button id="confirmRide" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/90 h-11 px-8 w-full">
            Confirm Ride Request
        </button>
    </main>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50"></div>

    <script src="../scripts/request-ride.js"></script>
</body>
</html>
