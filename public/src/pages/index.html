<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carosa — Ready to Ride</title>
    <link href="../assets/styles/tailwind.css" rel="stylesheet">
    <link href="../assets/styles/components.css" rel="stylesheet">
</head>
<body class="min-h-screen flex flex-col bg-background text-foreground">
    <header class="w-full border-b border-border/50 bg-background/95">
        <div class="container mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="flex items-center justify-center w-12 h-12 bg-primary rounded-lg">
                    <svg class="h-6 w-6 text-primary-foreground" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold">Carosa</h1>
                    <p class="text-xs text-muted-foreground">University Carpooling</p>
                </div>
            </div>

            <nav class="hidden md:flex items-center gap-4">
                <a href="find-ride.html" class="inline-flex items-center justify-center rounded-md text-sm font-medium focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 btn btn-primary">Find Ride</a>
            </nav>
        </div>
    </header>

    <main class="flex-1 container mx-auto px-4 py-12 flex items-center">
        <div class="w-full max-w-4xl mx-auto text-center">
            <!-- Big textual logo / hero -->
            <div class="mb-6">
                <h2 class="text-6xl font-extrabold leading-tight tracking-tight">Carosa<span class="text-primary">.</span></h2>
            </div>

            <p class="text-2xl text-muted-foreground mb-8">Ready to Ride? Carpool now with SLU Maryheights!</p>

            <div class="flex justify-center">
                <a href="find-ride.html" class="btn btn-primary px-8 py-3 text-lg">Find Ride</a>
            </div>

            <p class="mt-10 text-sm text-muted-foreground">Safe rides for students and staff. Share a trip, save money, and help the campus community.</p>
        </div>
    </main>

    <footer class="border-t border-border/50 bg-card py-6">
        <div class="container mx-auto px-4 text-center text-sm text-muted-foreground">
            © <span id="year"></span> Carosa — SLU Maryheights
        </div>
    </footer>

    <script>
        // Small script to set year
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
