<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Ride - Corosa Driver</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css"
    />
    <link rel="stylesheet" href="../../styles/styles.css" />
    <style>
      /* Route preview card - extends project design */
      .dashboard-section .route-preview {
        background: linear-gradient(
          135deg,
          rgba(102, 126, 234, 0.08) 0%,
          rgba(118, 75, 162, 0.08) 100%
        );
        border: 2px solid rgba(102, 126, 234, 0.2);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
      }

      .route-preview h4 {
        margin: 0 0 16px 0;
        font-size: 1em;
        color: #1a1a1a;
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }

      .route-preview h4 i {
        color: #667eea;
        font-size: 1.1em;
      }

      .route-points {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .location-point {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }

      .location-pin {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 1.1em;
        flex-shrink: 0;
      }

      .location-pin.pickup {
        background: #667eea;
      }

      .location-pin.dropoff {
        background: #764ba2;
      }

      .location-content {
        flex: 1;
      }

      .location-label {
        font-size: 0.75em;
        color: #999;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        margin-bottom: 2px;
        font-weight: 600;
      }

      .location-address {
        font-size: 0.95em;
        color: #1a1a1a;
        font-weight: 500;
      }

      .route-divider {
        width: 2px;
        height: 16px;
        background: linear-gradient(to bottom, #667eea, #764ba2);
        margin-left: 17px;
        margin-top: -4px;
        margin-bottom: -4px;
      }

      /* Form section styling */
      .create-ride-form {
        background: white;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      }

      .create-ride-form h3 {
        margin: 0 0 20px 0;
        font-size: 1em;
        color: #1a1a1a;
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }

      .create-ride-form h3 i {
        color: #667eea;
        font-size: 1.1em;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 20px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
      }

      .form-group label {
        font-weight: 600;
        color: #1a1a1a;
        margin-bottom: 6px;
        font-size: 0.9em;
      }

      .form-group input,
      .form-group select {
        padding: 11px 12px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 0.95em;
        font-family: inherit;
        transition: all 0.2s;
      }

      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      /* Action buttons */
      .form-actions {
        display: flex;
        gap: 12px;
        padding-top: 20px;
        border-top: 1px solid #e0e0e0;
        margin-top: 20px;
      }

      .form-actions .btn {
        flex: 1;
        padding: 11px 16px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.95em;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .form-actions .btn-primary {
        background: var(--color-primary);
        color: var(--color-primary-foreground);
      }

      .form-actions .btn-primary:hover:not(:disabled) {
        background-color: hsl(0, 100%, 35%);
        transform: translateY(-2px);
      }

      .form-actions .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .form-actions .btn-secondary {
        background: #f5f5f5;
        color: #333;
        border: 1px solid #e0e0e0;
      }

      .form-actions .btn-secondary:hover {
        background: #eeeeee;
      }

      /* Loading spinner */
      .loading-spinner {
        display: none;
        text-align: center;
        padding: 20px;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .loading-spinner.show {
        display: flex;
      }

      .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #667eea;
        border-radius: 50%;
        width: 32px;
        height: 32px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* Error & success banners */
      #errorBanner {
        display: none;
        padding: 12px 16px;
        background: #ffebee;
        border-left: 4px solid #f44336;
        border-radius: 6px;
        color: #c62828;
        margin-bottom: 20px;
        font-size: 0.9em;
      }

      #errorBanner.show {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #errorBanner i {
        font-size: 1.1em;
        flex-shrink: 0;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .form-row {
          grid-template-columns: 1fr;
        }

        .form-actions {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="container header-content">
        <img
          src="../../assets/corosa-logo.png"
          alt="Corosa Logo"
          class="logo"
        />
        <nav class="nav header-nav">
          <a class="btn btn-outline" href="driver-Homepage.html">Back</a>
          <div class="profile-menu-wrapper">
            <button
              class="btn btn-outline profile-btn"
              id="profile-menu-btn"
              aria-label="Profile menu"
            >
              <i class="bx bx-user-circle"></i>
            </button>
            <div class="profile-dropdown" id="profile-dropdown">
              <a
                href="../../shared/pages/user-profile.html"
                class="dropdown-item"
              >
                <i class="bx bx-user"></i> Profile
              </a>
              <a href="driver-settings.html" class="dropdown-item">
                <i class="bx bx-cog"></i> Settings
              </a>
              <button class="dropdown-item logout-btn" id="logout-btn">
                <i class="bx bx-log-out"></i> Logout
              </button>
            </div>
          </div>
        </nav>
        <button
          class="btn mobile-menu"
          id="mobile-menu-btn"
          aria-label="Open menu"
        >
          ☰
        </button>
      </div>
    </header>

    <!-- Main Dashboard -->
    <main class="driver-dashboard">
      <!-- Sidebar -->
      <aside class="dashboard-sidebar" id="dashboard-sidebar">
        <div class="sidebar-header">
          <button
            class="sidebar-toggle"
            id="sidebar-toggle"
            aria-label="Toggle sidebar"
          >
            <i class="bx bx-chevron-left"></i>
          </button>
        </div>
        <nav class="sidebar-nav">
          <a href="driver-Homepage.html" class="sidebar-link" title="Dashboard">
            <i class="bx bx-home"></i>
            <span class="sidebar-text">Dashboard</span>
          </a>
          <a
            href="driver-rideconfirmation.html"
            class="sidebar-link"
            title="Ride Requests"
          >
            <i class="bx bx-bell"></i>
            <span class="sidebar-text">Ride Requests</span>
          </a>
          <a
            href="driver-passengerstatus.html"
            class="sidebar-link"
            title="Active Trip"
          >
            <i class="bx bx-navigation"></i>
            <span class="sidebar-text">Active Trip</span>
          </a>
          <a
            href="driver-history.html"
            class="sidebar-link"
            title="Trip History"
          >
            <i class="bx bx-history"></i>
            <span class="sidebar-text">Trip History</span>
          </a>
          <a
            href="driver-passengerfeedback.html"
            class="sidebar-link"
            title="Ratings"
          >
            <i class="bx bx-star"></i>
            <span class="sidebar-text">Ratings</span>
          </a>
          <a href="driver-settings.html" class="sidebar-link" title="Settings">
            <i class="bx bx-cog"></i>
            <span class="sidebar-text">Settings</span>
          </a>
        </nav>
      </aside>

      <!-- Page Content -->
      <div class="dashboard-content">
        <!-- Error Banner -->
        <div id="errorBanner"></div>

        <!-- Page Title -->
        <div class="welcome-section">
          <div>
            <h2>Create a Ride</h2>
            <p>
              Offer a ride by selecting your route, departure time, and
              available seats.
            </p>
          </div>
        </div>

        <!-- Content Section -->
        <section class="dashboard-section" style="max-width: 600px">
          <!-- Route Preview -->
          <div class="route-preview">
            <h4><i class="bx bx-map"></i> Your Route</h4>
            <div class="route-points">
              <div class="location-point">
                <div class="location-pin pickup">
                  <i class="bx bx-map-pin"></i>
                </div>
                <div class="location-content">
                  <div class="location-label">Pickup</div>
                  <div class="location-address" id="pickupDisplay">
                    Loading...
                  </div>
                </div>
              </div>

              <div class="route-divider"></div>

              <div class="location-point">
                <div class="location-pin dropoff">
                  <i class="bx bx-location-plus"></i>
                </div>
                <div class="location-content">
                  <div class="location-label">Destination</div>
                  <div class="location-address" id="dropoffDisplay">
                    Loading...
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Ride Details Form -->
          <div class="create-ride-form">
            <h3><i class="bx bx-time"></i> Ride Details</h3>

            <form id="rideDetailsForm">
              <div class="form-row">
                <div class="form-group">
                  <label for="departureDateTime">Departure Time</label>
                  <input
                    type="datetime-local"
                    id="departureDateTime"
                    required
                  />
                </div>
                <div class="form-group">
                  <label for="seatCount">Available Seats</label>
                  <select id="seatCount" required>
                    <option value="">Select seats</option>
                    <option value="1">1 seat</option>
                    <option value="2">2 seats</option>
                    <option value="3">3 seats</option>
                    <option value="4">4 seats</option>
                    <option value="5">5 seats</option>
                    <option value="6">6 seats</option>
                    <option value="7">7 seats</option>
                    <option value="8">8 seats</option>
                  </select>
                </div>
              </div>

              <!-- Loading State -->
              <div class="loading-spinner" id="loadingState">
                <div class="spinner"></div>
                <p>Creating your ride...</p>
              </div>

              <!-- Action Buttons -->
              <div class="form-actions">
                <button
                  type="button"
                  class="btn btn-secondary"
                  onclick="window.history.back()"
                >
                  <i class="bx bx-chevron-left"></i> Back
                </button>
                <button
                  type="submit"
                  class="btn btn-primary"
                  id="createRideBtn"
                  disabled
                >
                  <i class="bx bx-check"></i> Create Ride
                </button>
              </div>
            </form>
          </div>
        </section>
      </div>
    </main>

    <!-- Scripts -->
    <script src="../../shared/js/api-config.js"></script>
    <script src="../../shared/js/navigation-helper.js"></script>
    <script src="../../shared/js/header-auth.js"></script>
    <script src="../js/sidebar-manager.js"></script>
    <script src="../js/driver-create-ride.js"></script>
  </body>
</html>
