<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carosa - Post a Ride</title>
    <link href='https://cdn.boxicons.com/2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        /* --- CAROSA DESIGN SYSTEM --- */
        :root {
            /* Colors */
            --primary: #4F46E5;
            --primary-dark: #4338ca;
            --primary-light: #e0e7ff;
            --background: #f3f4f6;
            --background-alt: #ffffff;
            --background-hover: #f9fafb;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --accent: #8b5cf6;
            --success: #10b981;
            --error: #ef4444;

            /* Spacing */
            --spacing-xl: 3rem;
            --spacing-lg: 2rem;
            --spacing-md: 1rem;
            --spacing-sm: 0.5rem;

            /* Typography */
            --font-size-3xl: 2.25rem;
            --font-size-2xl: 1.5rem;
            --font-size-xl: 1.25rem;
            --font-size-lg: 1.125rem;
            --font-size-base: 1rem;
            --font-size-sm: 0.875rem;

            --radius-lg: 0.75rem;
            --radius-md: 0.375rem;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        /* RESET & BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: var(--background);
            color: var(--text-primary);
            padding-bottom: var(--spacing-xl);
        }

        /* HEADER */
        .header {
            background: var(--background-alt);
            padding: var(--spacing-md) 0;
            border-bottom: 1px solid var(--primary-light);
            margin-bottom: var(--spacing-lg);
        }
        .header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 var(--spacing-md);
        }
        .logo { font-weight: 800; font-size: var(--font-size-xl); color: var(--primary); text-decoration: none; }
        
        .nav-link {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            margin-right: var(--spacing-md);
            transition: color 0.2s;
        }
        .nav-link:hover { color: var(--primary); }

        /* MAIN LAYOUT */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 var(--spacing-md);
        }

        h1 { font-size: var(--font-size-2xl); margin-bottom: var(--spacing-md); color: var(--text-primary); }
        .section-title { font-size: var(--font-size-lg); font-weight: 600; margin-bottom: var(--spacing-md); color: var(--text-primary); }

        /* COMPONENT: CARD */
        .card {
            background: var(--background-alt);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
            margin-bottom: var(--spacing-lg);
        }

        /* LOCATION INPUTS (VISUAL ROUTE) */
        .route-inputs {
            position: relative;
            padding-left: var(--spacing-lg);
        }
        
        /* The vertical line connecting inputs */
        .route-line-dashed {
            position: absolute;
            left: 11px; /* Center of the dots */
            top: 25px;
            bottom: 25px;
            width: 2px;
            border-left: 2px dashed var(--text-muted);
            opacity: 0.5;
            z-index: 0;
        }

        .input-group {
            position: relative;
            margin-bottom: var(--spacing-lg);
        }
        .input-group:last-child { margin-bottom: 0; }

        .location-dot {
            position: absolute;
            left: -32px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            border-radius: 50%;
            z-index: 1;
        }
        .location-dot.pickup { background: var(--primary); border: 3px solid var(--background-alt); box-shadow: 0 0 0 1px var(--primary); }
        .location-dot.dropoff { background: var(--accent); border: 3px solid var(--background-alt); box-shadow: 0 0 0 1px var(--accent); }

        /* FORM ELEMENTS */
        label {
            display: block;
            font-size: var(--font-size-sm);
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-sm);
        }

        input[type="text"],
        input[type="date"],
        input[type="time"],
        input[type="number"] {
            width: 100%;
            padding: var(--spacing-md);
            border: 1px solid #d1d5db; /* gray-300 */
            border-radius: var(--radius-md);
            font-size: var(--font-size-base);
            transition: border-color 0.2s, box-shadow 0.2s;
            background: var(--background-hover);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
            background: var(--background-alt);
        }

        /* GRID FOR TIME/DATE/SEATS */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-lg);
        }

        /* COUNTER INPUT (SEATS) */
        .counter-wrapper {
            display: flex;
            align-items: center;
            border: 1px solid #d1d5db;
            border-radius: var(--radius-md);
            overflow: hidden;
        }
        .counter-btn {
            background: var(--background);
            border: none;
            padding: var(--spacing-md);
            cursor: pointer;
            color: var(--text-primary);
            font-size: 1.2rem;
            transition: background 0.2s;
        }
        .counter-btn:hover { background: #e5e7eb; }
        .counter-input {
            width: 50px;
            text-align: center;
            border: none;
            margin: 0;
            padding: var(--spacing-md) 0;
            -moz-appearance: textfield; /* Remove arrows firefox */
        }
        .counter-input::-webkit-outer-spin-button,
        .counter-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* CURRENCY INPUT WRAPPER */
        .currency-wrapper {
            position: relative;
        }
        .currency-symbol {
            position: absolute;
            left: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-weight: 500;
        }
        .currency-input {
            padding-left: 2.5rem !important; /* Make room for symbol */
        }

        /* BUTTONS */
        .btn-primary {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: var(--spacing-md);
            border: none;
            border-radius: var(--radius-md);
            font-size: var(--font-size-base);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
        }
        .btn-primary:hover { background: var(--primary-dark); }

        /* Responsive adjustments */
        @media (max-width: 640px) {
            .grid-2 { grid-template-columns: 1fr; gap: var(--spacing-md); }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-content">
            <a href="#" class="logo">Carosa Driver</a>
            <nav>
                <a href="driver_requests.html" class="nav-link">Requests</a>
                <a href="#" class="nav-link" style="color: var(--primary);">Post Ride</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>Post a New Ride</h1>

        <form id="postRideForm">
            
            <!-- ROUTE SECTION -->
            <div class="card">
                <h2 class="section-title">Route Details</h2>
                
                <div class="route-inputs">
                    <div class="route-line-dashed"></div>
                    
                    <!-- Pickup -->
                    <div class="input-group">
                        <div class="location-dot pickup"></div>
                        <label for="pickup">Pickup Location</label>
                        <input type="text" id="pickup" name="pickup" placeholder="Enter city, landmark, or address" required autocomplete="off">
                    </div>

                    <!-- Dropoff -->
                    <div class="input-group">
                        <div class="location-dot dropoff"></div>
                        <label for="dropoff">Drop-off Location</label>
                        <input type="text" id="dropoff" name="dropoff" placeholder="Enter destination" required autocomplete="off">
                    </div>
                </div>
            </div>

            <!-- SCHEDULE SECTION -->
            <div class="card">
                <h2 class="section-title">Schedule</h2>
                <div class="grid-2">
                    <div>
                        <label for="date">Date</label>
                        <input type="date" id="date" name="date" required>
                    </div>
                    <div>
                        <label for="time">Time</label>
                        <input type="time" id="time" name="time" required>
                    </div>
                </div>
            </div>

            <!-- RIDE CONFIGURATION (Seats & Price) -->
            <div class="card">
                <h2 class="section-title">Ride Configuration</h2>
                <div class="grid-2">
                    
                    <!-- Seat Counter -->
                    <div>
                        <label for="seats">Available Seats</label>
                        <div class="counter-wrapper">
                            <button type="button" class="counter-btn" onclick="adjustSeats(-1)">-</button>
                            <input type="number" id="seats" name="seats" class="counter-input" value="1" min="1" max="6" readonly>
                            <button type="button" class="counter-btn" onclick="adjustSeats(1)">+</button>
                        </div>
                    </div>

                    <!-- Price Input -->
                    <div>
                        <label for="price">Fare per Passenger</label>
                        <div class="currency-wrapper">
                            <span class="currency-symbol">₱</span>
                            <input type="number" id="price" name="price" class="currency-input" placeholder="0.00" min="0" step="10" required>
                        </div>
                        <small style="color: var(--text-muted); margin-top: 4px; display: block;">Recommended: ₱80-150</small>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-primary">
                <i class='bx bx-paper-plane'></i> Post Ride
            </button>

        </form>
    </main>

    <script>
        // Authentication check - Verify user is logged in as driver
        window.addEventListener('DOMContentLoaded', function() {
            const userData = localStorage.getItem('userData');
            if (!userData) {
                window.location.href = '../../shared/pages/login.html';
                return;
            }
            
            const user = JSON.parse(userData);
            if (user.role !== 'driver') {
                window.location.href = '../../shared/pages/index.html';
                return;
            }
            
            // Prepopulate pickup and dropoff from sessionStorage (if coming from location picker)
            const pickupInput = document.getElementById('pickup');
            const dropoffInput = document.getElementById('dropoff');
            
            const pickupLocation = sessionStorage.getItem('driverPickupLocation');
            const dropoffLocation = sessionStorage.getItem('driverDropoffLocation');
            
            if (pickupLocation) {
                pickupInput.value = pickupLocation;
            }
            if (dropoffLocation) {
                dropoffInput.value = dropoffLocation;
            }
        });

        // Set minimum date to today
        const dateInput = document.getElementById('date');
        dateInput.min = new Date().toISOString().split("T")[0];

        // Seat Counter Logic
        function adjustSeats(delta) {
            const input = document.getElementById('seats');
            let val = parseInt(input.value) || 0;
            val += delta;
            if (val < 1) val = 1;
            if (val > 10) val = 10; // Max van capacity example
            input.value = val;
        }

        // Form Submission Logic
        document.getElementById('postRideForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Gather Data
            const formData = {
                pickup: document.getElementById('pickup').value,
                dropoff: document.getElementById('dropoff').value,
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                seats: document.getElementById('seats').value,
                price: document.getElementById('price').value
            };

            // Basic Validation Visual
            if(!formData.pickup || !formData.dropoff || !formData.price) {
                alert("Please fill in all details");
                return;
            }

            // Simulate API Call/Loading
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class='bx bx-loader-alt bx-spin'></i> Posting...`;
            btn.disabled = true;

            setTimeout(() => {
                alert(`Ride Posted Successfully!\n\nFrom: ${formData.pickup}\nTo: ${formData.dropoff}\nFare: ₱${formData.price}`);
                // Reset form or redirect
                // window.location.href = 'driver_requests.html';
                btn.innerHTML = originalText;
                btn.disabled = false;
                this.reset();
                document.getElementById('seats').value = 1; // Reset seat counter
            }, 1500);
        });
    </script>
</body>
</html>
