<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carosa - Vehicle Registration</title>
    <style>
        /* CAROSA DESIGN SYSTEM VARIABLES - RED THEME */
        :root {
            /* --- Colors (Red Theme) --- */
            --primary: #d32f2f;          /* Standard Red */
            --primary-dark: #b71c1c;     /* Darker Red for hover */
            --primary-light: #ffcdd2;    /* Light Red for backgrounds */
            --primary-fade: rgba(211, 47, 47, 0.08); /* Very light red for hover states */
            
            --background: #f8f9fa;
            --background-alt: #ffffff;
            --background-hover: #fff5f5; /* Warm/Red tint on hover */
            
            --text-primary: #212121;
            --text-secondary: #757575;
            --text-muted: #9e9e9e;
            
            --error: #d32f2f;
            
            /* Spacing */
            --spacing-xl: 3rem;
            --spacing-lg: 2rem;
            --spacing-md: 1rem;
            --spacing-sm: 0.5rem;
            
            /* Typography */
            --font-size-3xl: 2.25rem;
            --font-size-2xl: 1.5rem;
            --font-size-lg: 1.125rem;
            --font-size-base: 1rem;
            --font-size-sm: 0.875rem;
            
            --font-weight-bold: 700;
            --font-weight-semibold: 600;
            --font-weight-medium: 500;

            /* UI Elements */
            --radius-lg: 12px;
            --radius-md: 8px;
            --max-width: 800px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.12);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* RESET & BASE STYLES */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* LAYOUT CONTAINERS */
        .container {
            max-width: var(--max-width);
            margin: var(--spacing-xl) auto;
            padding: 0 var(--spacing-md);
        }

        /* TYPOGRAPHY */
        h1 {
            font-size: var(--font-size-3xl);
            font-weight: var(--font-weight-bold);
            margin-bottom: var(--spacing-lg);
            text-align: center;
            color: var(--text-primary);
        }

        h2 {
            font-size: var(--font-size-2xl);
            font-weight: var(--font-weight-semibold);
            margin-bottom: var(--spacing-md);
            color: var(--text-primary);
        }

        /* COMPONENT: CARD */
        .card {
            background-color: var(--background-alt);
            padding: var(--spacing-lg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid #e0e0e0;
        }

        /* FORMS */
        .form-section {
            margin-bottom: var(--spacing-lg);
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: var(--spacing-lg);
        }

        .form-section:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .form-group {
            margin-bottom: var(--spacing-lg);
            display: flex;
            flex-direction: column;
        }

        label {
            color: var(--text-secondary);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-semibold);
            margin-bottom: var(--spacing-sm);
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="email"],
        select {
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: var(--radius-md);
            font-size: var(--font-size-base);
            color: var(--text-primary);
            background-color: var(--background-alt);
            transition: all 0.2s;
            width: 100%;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-fade); /* Red glow */
        }

        /* FILE UPLOAD COMPONENT */
        .file-upload-wrapper {
            border: 2px dashed #bdbdbd;
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            text-align: center;
            cursor: pointer;
            background-color: var(--background);
            transition: all 0.3s ease;
        }

        .file-upload-wrapper:hover {
            border-color: var(--primary);
            background-color: var(--primary-fade);
        }

        .file-upload-input {
            display: none;
        }

        .preview-image {
            max-width: 100%;
            max-height: 200px;
            margin-top: var(--spacing-md);
            border-radius: var(--radius-md);
            display: none;
            box-shadow: var(--shadow-sm);
        }

        /* GRID SYSTEM FOR FORM */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-lg);
        }

        /* BUTTONS */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 14px;
            border: none;
            border-radius: var(--radius-md);
            font-weight: var(--font-weight-semibold);
            font-size: var(--font-size-base);
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(211, 47, 47, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 12px rgba(211, 47, 47, 0.3);
            background: linear-gradient(135deg, #b71c1c 0%, #8e0000 100%);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 768px) {
            .container {
                margin: var(--spacing-lg) auto;
            }
            
            .card {
                padding: var(--spacing-md);
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: var(--spacing-md);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Vehicle Registration</h1>

        <form id="vehicleForm" class="card">
            
            <div class="form-section">
                <h2>Driver Details</h2>
                
                <div class="form-group">
                    <label for="driverName">Full Name</label>
                    <input type="text" id="driverName" name="driverName" placeholder="Enter driver's full name" required>
                </div>

                <div class="form-group">
                    <label for="birthdate">Birth Date</label>
                    <input type="date" id="birthdate" name="birthdate" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter email address" required>
                </div>

                <div class="form-group">
                    <label>Driver's License Photo</label>
                    <div class="file-upload-wrapper" id="dropZone">
                        <span style="color: var(--text-secondary);">Click to upload or drag license image here</span>
                        <input type="file" id="licenseUpload" name="licenseUpload" accept="image/*" class="file-upload-input" required>
                        <img id="licensePreview" class="preview-image" alt="License Preview">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h2>Vehicle Information</h2>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="vehicleType">Vehicle Type</label>
                        <select id="vehicleType" name="vehicleType" required>
                            <option value="" disabled selected>Select type</option>
                            <option value="sedan">Sedan</option>
                            <option value="suv">SUV</option>
                            <option value="van">Van</option> 
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="vehicleModel">Model</label>
                        <input type="text" id="vehicleModel" name="vehicleModel" placeholder="e.g., Toyota Vios" required>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="plateNumber">Plate Number</label>
                        <input type="text" id="plateNumber" name="plateNumber" placeholder="ABC 1234" style="text-transform: uppercase;" required>
                    </div>

                    <div class="form-group">
                        <label for="seatingCapacity">Seating Capacity</label>
                        <input type="number" id="seatingCapacity" name="seatingCapacity" min="1" max="50" placeholder="4" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-primary">Register Vehicle</button>

        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('licenseUpload');
            const preview = document.getElementById('licensePreview');
            const form = document.getElementById('vehicleForm');

            // Handle clicking the upload area
            dropZone.addEventListener('click', () => fileInput.click());

            // Handle file selection
            fileInput.addEventListener('change', function(e) {
                handleFile(this.files[0]);
            });

            // Handle Drag and Drop visuals
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.style.borderColor = 'var(--primary)';
                dropZone.style.backgroundColor = 'var(--primary-fade)';
            });

            dropZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                dropZone.style.borderColor = '#bdbdbd';
                dropZone.style.backgroundColor = 'var(--background)';
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.style.borderColor = '#bdbdbd';
                dropZone.style.backgroundColor = 'var(--background)';
                
                if (e.dataTransfer.files.length) {
                    fileInput.files = e.dataTransfer.files;
                    handleFile(e.dataTransfer.files[0]);
                }
            });

            // Preview Image Logic
            function handleFile(file) {
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        preview.src = e.target.result;
                        preview.style.display = 'block';
                    }
                    reader.readAsDataURL(file);
                }
            }

            // Form Submission
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                // Collect Form Data
                const formData = new FormData(form);
                const data = Object.fromEntries(formData);
                
                console.log('Registration Data:', data);
                alert(`Vehicle Registration Submitted!\nDriver: ${data.driverName}\nPlate: ${data.plateNumber}`);
            });
        });
    </script>
</body>
</html>
