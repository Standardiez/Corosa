<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ride History — Corosa</title>
    <link rel="stylesheet" href="../../styles/unified-driver.css" />
    <link
      href="https://cdn.boxicons.com/3.0.3/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />
    <style>
      /* Page-specific overrides */
      .history-container {
        max-width: 800px;
        margin: 0 auto;
        padding-top: var(--spacing-lg);
      }

      .filter-bar {
        display: flex;
        gap: var(--spacing-sm);
        margin-bottom: var(--spacing-lg);
        flex-wrap: wrap;
      }

      .filter-btn {
        padding: 8px 16px;
        border: 1px solid var(--border-color);
        background: var(--background-card);
        border-radius: var(--radius-md);
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        color: var(--text-secondary);
      }

      .filter-btn.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }

      .filter-btn:hover:not(.active) {
        border-color: var(--primary);
        color: var(--primary);
      }

      .history-list {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-md);
      }

      .history-card {
        background: var(--background-card);
        border-radius: var(--radius-lg);
        padding: var(--spacing-md);
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--border-color);
        transition: all 0.2s;
      }

      .history-card:hover {
        box-shadow: var(--shadow-md);
        border-color: var(--primary-light);
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: var(--spacing-sm);
      }

      .card-passenger {
        display: flex;
        align-items: center;
        gap: var(--spacing-md);
      }

      .passenger-avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--gradient-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 600;
        font-size: 1rem;
      }

      .passenger-info h3 {
        font-size: 1rem;
        font-weight: 600;
        color: var(--text-main);
        margin: 0;
      }

      .passenger-info p {
        font-size: 0.85rem;
        color: var(--text-secondary);
        margin: 2px 0 0 0;
      }

      .card-status {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.85rem;
        font-weight: 600;
      }

      .status-icon {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
      }

      /* Status Colors */
      .status-completed { color: var(--success); }
      .status-cancelled { color: var(--error); }

      .status-icon.completed {
        background: #d1fae5;
        color: var(--success);
      }

      .status-icon.cancelled {
        background: #fee2e2;
        color: var(--error);
      }

      .card-body {
        margin-bottom: var(--spacing-md);
      }

      .route {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
        margin-bottom: 8px;
        font-size: 0.9rem;
      }

      .location {
        color: var(--text-main);
      }

      .trip-details {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: var(--spacing-sm);
        padding-top: var(--spacing-md);
        border-top: 1px solid var(--border-color);
        margin-bottom: var(--spacing-md);
      }

      .detail-item {
        text-align: center;
      }

      .detail-label {
        font-size: 0.75rem;
        color: var(--text-secondary);
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .detail-value {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-main);
      }

      .card-footer {
        display: flex;
        gap: var(--spacing-sm); /* Tighter gap for buttons */
      }

      .card-footer button, .card-footer a {
        flex: 1;
        text-align: center;
        text-decoration: none;
      }

      .rating-display {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .star {
        color: var(--warning);
        font-size: 14px;
      }
      
      .empty-state {
        text-align: center;
        padding: var(--spacing-xxl) var(--spacing-md);
        color: var(--text-secondary);
      }

      .empty-state i {
        font-size: 48px;
        color: var(--text-muted);
        margin-bottom: var(--spacing-md);
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="container header-content" style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
        <img
          src="../../assets/corosa-logo.png"
          alt="Corosa Logo"
          class="logo"
        />
        <nav class="nav header-nav" style="display: flex; gap: 8px;">
          <a class="btn btn-ghost" href="driver-passengerfeedback.html">
            <i class='bx bx-star'></i> My Reviews
          </a>
          <a class="btn btn-outline" href="driver-Homepage.html">Back</a>
        </nav>
      </div>
    </header>

    <main class="container history-container">
      <h1 style="margin-bottom: var(--spacing-lg); color: var(--text-main);">Ride History</h1>

      <div class="filter-bar">
        <button class="filter-btn active" onclick="filterHistory('all')">
          All Rides
        </button>
        <button class="filter-btn" onclick="filterHistory('completed')">
          Completed
        </button>
        <button class="filter-btn" onclick="filterHistory('cancelled')">
          Cancelled
        </button>
      </div>

      <div class="history-list" id="historyList">
        </div>
    </main>

    <script>
      // UPDATED SAMPLE DATA: Added 'feedback_id' to connect to specific reviews
      const sampleHistory = [
        {
          id: 1,
          passenger: "Sarah Johnson",
          initials: "SJ",
          from: "123 Main Street",
          to: "Downtown Station",
          date: "2024-01-15",
          time: "2:30 PM",
          distance: "3.2 km",
          duration: "12 min",
          fare: "₱85.00",
          status: "completed",
          rating: 5,
          feedback_id: "review-1" // Links to ID in feedback page
        },
        {
          id: 2,
          passenger: "Mike Chen",
          initials: "MC",
          from: "456 Business Ave",
          to: "Shopping Mall",
          date: "2024-01-14",
          time: "10:15 AM",
          distance: "5.1 km",
          duration: "18 min",
          fare: "₱120.00",
          status: "completed",
          rating: 4,
          feedback_id: "review-2" // Links to ID in feedback page
        },
        {
          id: 3,
          passenger: "Emma Wilson",
          initials: "EW",
          from: "789 Park Lane",
          to: "Airport Terminal 3",
          date: "2024-01-13",
          time: "6:45 PM",
          distance: "18.5 km",
          duration: "35 min",
          fare: "₱425.00",
          status: "completed",
          rating: 5,
          feedback_id: null // No written feedback
        },
        {
          id: 4,
          passenger: "John Davis",
          initials: "JD",
          from: "Coffee Shop Downtown",
          to: "University Campus",
          date: "2024-01-12",
          time: "11:20 AM",
          distance: "4.8 km",
          duration: "16 min",
          fare: "₱107.50",
          status: "cancelled",
          rating: null,
          feedback_id: null
        },
      ];

      let currentFilter = "all";

      function renderHistory() {
        const historyList = document.getElementById("historyList");
        historyList.innerHTML = "";

        const filtered = sampleHistory.filter((ride) => {
          if (currentFilter === "all") return true;
          if (currentFilter === "completed") return ride.status === "completed";
          if (currentFilter === "cancelled") return ride.status === "cancelled";
          return true;
        });

        if (filtered.length === 0) {
          historyList.innerHTML = `
          <div class="empty-state">
            <i class='bx bx-inbox'></i>
            <p>No rides found</p>
          </div>
        `;
          return;
        }

        filtered.forEach((ride) => {
          const statusClass = ride.status === "completed" ? "completed" : "cancelled";
          const statusIcon = ride.status === "completed" ? "✓" : "✕";
          const statusText = ride.status === "completed" ? "Completed" : "Cancelled";
          const statusTextClass = ride.status === "completed" ? "status-completed" : "status-cancelled";

          // Generate Star Display
          const ratingHtml = ride.rating
            ? `
          <div class="rating-display">
            ${Array(ride.rating).fill(0).map(() => '<span class="star">★</span>').join("")}
          </div>
        ` : "";

          // LOGIC: Check if there is feedback to link to
          // If feedback_id exists, create a link to the feedback page
          const feedbackButton = ride.feedback_id 
            ? `<a href="driver-passengerfeedback.html#${ride.feedback_id}" class="btn btn-outline" style="font-size: 0.9rem;">
                 <i class='bx bx-message-detail'></i> Read Review
               </a>`
            : "";

          const card = document.createElement("div");
          card.className = "history-card";
          
          card.innerHTML = `
          <div class="card-header">
            <div class="card-passenger">
              <div class="passenger-avatar">${ride.initials}</div>
              <div class="passenger-info">
                <h3>${ride.passenger}</h3>
                <p>${ride.date}</p>
              </div>
            </div>
            <div class="card-status ${statusTextClass}">
              <span class="status-icon ${statusClass}">${statusIcon}</span>
              ${statusText}
            </div>
          </div>
          
          <div class="card-body">
            <div class="route">
              <i class='bx bx-location-plus' style="color: var(--primary);"></i>
              <span class="location">${ride.from}</span>
            </div>
            <div class="route">
              <i class='bx bx-location-minus' style="color: var(--primary-hover);"></i>
              <span class="location">${ride.to}</span>
            </div>
          </div>
          
          <div class="trip-details">
            <div class="detail-item">
              <div class="detail-label">Time</div>
              <div class="detail-value">${ride.time}</div>
            </div>
            <div class="detail-item">
              <div class="detail-label">Fare</div>
              <div class="detail-value">${ride.fare}</div>
            </div>
            <div class="detail-item">
               <div class="detail-label">Rating</div>
              <div class="detail-value">${ride.rating ? ride.rating + " ★" : "-"}</div>
            </div>
          </div>
          
          <div class="card-footer">
            <button class="btn btn-ghost" onclick="viewDetails(${ride.id})">Details</button>
            ${feedbackButton} ${ride.status === "completed" && !ride.rating 
                ? `<button class="btn btn-primary" onclick="ratePassenger(${ride.id})">Rate User</button>` 
                : "" 
             }
          </div>
        `;
          historyList.appendChild(card);
        });
      }

      function filterHistory(filter) {
        currentFilter = filter;
        document.querySelectorAll(".filter-btn").forEach((btn) => {
          btn.classList.remove("active");
        });
        event.target.classList.add("active");
        renderHistory();
      }

      function viewDetails(rideId) {
        alert("View details for ride #" + rideId);
      }

      function ratePassenger(rideId) {
        alert("Rate passenger for ride #" + rideId);
      }

      window.addEventListener("DOMContentLoaded", function () {
        renderHistory();
      });
    </script>
    <script src="../../shared/js/header-auth.js"></script>
  </body>
</html>
