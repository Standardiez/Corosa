<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking Requests - Corosa Driver</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css"
    />
    <link rel="stylesheet" href="../styles/styles.css" />
    <style>
      .requests-container {
        display: flex;
        min-height: calc(100vh - 60px);
        margin-left: 250px;
        transition: margin-left 0.3s ease;
        padding: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }

      .sidebar.collapsed ~ .requests-container {
        margin-left: 80px;
      }

      .requests-wrapper {
        flex: 1;
        max-width: 1000px;
        margin: 0 auto;
        width: 100%;
      }

      .requests-header {
        background: white;
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
      }

      .requests-header h1 {
        margin: 0;
        color: #333;
        font-size: 1.6em;
      }

      .header-actions {
        display: flex;
        gap: 12px;
      }

      .btn-refresh {
        padding: 10px 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: transform 0.2s;
      }

      .btn-refresh:hover {
        transform: translateY(-2px);
      }

      .filter-container {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      #filterSelect {
        padding: 10px 16px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 0.95em;
        cursor: pointer;
        background: white;
      }

      .error-message {
        display: none;
        padding: 16px;
        background-color: #ffebee;
        border-left: 4px solid #f44336;
        border-radius: 8px;
        color: #c62828;
        margin-bottom: 20px;
        font-size: 0.95em;
      }

      #requestsList {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .booking-request {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
      }

      .booking-request:hover {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        transform: translateY(-2px);
      }

      .request-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
      }

      .passenger-info h3 {
        margin: 0;
        font-size: 1.2em;
      }

      .passenger-phone {
        margin: 8px 0 0 0;
        font-size: 0.95em;
        opacity: 0.9;
      }

      .status-badge {
        padding: 8px 16px;
        border-radius: 20px;
        font-weight: 600;
        font-size: 0.85em;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .status-pending {
        background: #fff3e0;
        color: #f57c00;
      }

      .status-confirmed {
        background: #e8f5e9;
        color: #388e3c;
      }

      .status-rejected {
        background: #f3e5f5;
        color: #7b1fa2;
      }

      .request-details {
        padding: 20px;
        border-bottom: 1px solid #eee;
      }

      .route-info {
        margin-bottom: 20px;
      }

      .location-item {
        display: flex;
        gap: 12px;
        margin-bottom: 12px;
      }

      .location-item i {
        font-size: 1.2em;
        color: #667eea;
        margin-top: 2px;
        flex-shrink: 0;
      }

      .location-label {
        font-size: 0.85em;
        color: #999;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .location-address {
        margin: 4px 0 0 0;
        color: #333;
        font-weight: 500;
      }

      .route-line {
        width: 2px;
        height: 20px;
        background: linear-gradient(to bottom, #667eea, transparent);
        margin: 0 0 0 7px;
      }

      .request-meta {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        font-size: 0.95em;
        color: #666;
      }

      .request-meta p {
        margin: 0;
      }

      .request-meta strong {
        color: #333;
      }

      .points {
        background: #fff3e0;
        padding: 2px 8px;
        border-radius: 4px;
        color: #f57c00;
        font-weight: 600;
      }

      .request-actions {
        padding: 16px 20px;
        background: #f9f9f9;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .btn-action {
        flex: 1;
        min-width: 120px;
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.2s;
        font-size: 0.95em;
      }

      .btn-accept {
        background: #e8f5e9;
        color: #388e3c;
        border: 1px solid #4caf50;
      }

      .btn-accept:hover {
        background: #c8e6c9;
        transform: translateY(-2px);
      }

      .btn-reject {
        background: #f3e5f5;
        color: #7b1fa2;
        border: 1px solid #ba68c8;
      }

      .btn-reject:hover {
        background: #e1bee7;
        transform: translateY(-2px);
      }

      .btn-confirmed,
      .btn-rejected {
        background: #f5f5f5;
        color: #999;
        border: 1px solid #ddd;
        cursor: not-allowed;
      }

      #emptyState {
        display: none;
        text-align: center;
        padding: 60px 20px;
        background: white;
        border-radius: 12px;
        color: #999;
      }

      #emptyState i {
        font-size: 3em;
        color: #ddd;
        margin-bottom: 16px;
      }

      #emptyState h3 {
        margin: 0 0 8px 0;
        color: #666;
      }

      #emptyState p {
        margin: 0;
        font-size: 0.95em;
      }

      #loadingSpinner {
        display: none;
        text-align: center;
        padding: 40px;
      }

      .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #667eea;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 16px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 768px) {
        .requests-container {
          margin-left: 0;
          padding: 10px;
        }

        .requests-header {
          padding: 16px;
          flex-direction: column;
        }

        .request-header {
          flex-direction: column;
          align-items: flex-start;
        }

        .request-meta {
          grid-template-columns: 1fr;
        }

        .request-actions {
          flex-direction: column;
        }

        .btn-action {
          min-width: unset;
        }
      }
    </style>
  </head>
  <body>
    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h2>Corosa Driver</h2>
        <button id="sidebarToggle" class="sidebar-toggle">
          <i class="bx bx-menu"></i>
        </button>
      </div>
      <div class="sidebar-menu">
        <a href="driver-Homepage.html">
          <i class="bx bx-home-alt"></i>
          <span>Home</span>
        </a>
        <a href="driver-makeride.html">
          <i class="bx bx-plus-circle"></i>
          <span>Offer a Ride</span>
        </a>
        <a href="driver-ridestatus.html">
          <i class="bx bx-car"></i>
          <span>My Rides</span>
        </a>
        <a href="driver-requests.html" class="active">
          <i class="bx bx-bell"></i>
          <span>Booking Requests</span>
        </a>
        <a href="driver-ratepassengers.html">
          <i class="bx bx-star"></i>
          <span>Rate Passengers</span>
        </a>
        <a href="user-profile.html">
          <i class="bx bx-user"></i>
          <span>Profile</span>
        </a>
      </div>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="logout-btn">
          <i class="bx bx-log-out"></i>
          <span>Logout</span>
        </button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="requests-container">
      <div class="requests-wrapper">
        <!-- Header -->
        <div class="requests-header">
          <h1><i class="bx bx-bell"></i> Booking Requests</h1>
          <div class="header-actions">
            <div class="filter-container">
              <label
                for="filterSelect"
                style="margin: 0; font-weight: 600; color: #666"
                >Filter:</label
              >
              <select id="filterSelect">
                <option value="all">All Requests</option>
                <option value="pending">Pending</option>
                <option value="confirmed">Confirmed</option>
                <option value="rejected">Rejected</option>
              </select>
            </div>
            <button id="refreshBtn" class="btn-refresh">
              <i class="bx bx-refresh"></i> Refresh
            </button>
          </div>
        </div>

        <!-- Error Message -->
        <div id="errorMsg" class="error-message"></div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner">
          <div class="spinner"></div>
          <p>Loading your requests...</p>
        </div>

        <!-- Requests List -->
        <div id="requestsList"></div>

        <!-- Empty State -->
        <div id="emptyState">
          <i class="bx bx-inbox"></i>
          <h3>No Booking Requests</h3>
          <p>You'll see passenger booking requests here once you post a ride</p>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="../js/header-auth.js"></script>
    <script src="../js/sidebar-manager.js"></script>
    <script src="../js/driver-bookings.js"></script>
  </body>
</html>
